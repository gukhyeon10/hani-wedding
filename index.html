<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff0cf">
<title>하니의 결혼식 | 운명의 제비뽑기</title>
<style>
:root{--ink:#38251d;--red:#e84b48;--gold:#e6a83e;--paper:#fff8e9;--muted:#816e60}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;background:radial-gradient(circle at 15% 15%,#fff 0 2px,transparent 3px),linear-gradient(135deg,#ffe7b9,#ffd8d2 55%,#f8e5ff);background-size:32px 32px,auto;display:grid;place-items:center;padding:22px;overflow-x:hidden}
.wrap{width:min(720px,100%);background:rgba(255,250,239,.94);border:3px solid #fff;border-radius:30px;box-shadow:0 18px 55px #804a3833;padding:clamp(20px,5vw,42px);text-align:center;position:relative;overflow:hidden}
.kicker{font-size:11px;font-weight:1000;letter-spacing:3px;color:#a27b55}.title{font-size:clamp(38px,9vw,66px);line-height:1.05;letter-spacing:-3px;font-weight:1000;margin:13px 0 8px;text-shadow:3px 4px 0 #f4c66f}.title span{color:var(--red)}
.stamp{display:inline-block;background:var(--red);color:white;font-size:12px;font-weight:1000;padding:7px 14px;border-radius:5px;transform:rotate(-3deg);margin:10px}.desc{font-size:14px;font-weight:800;color:var(--muted);line-height:1.6}.decor{font-size:42px;margin:18px 0 12px}.notice{background:#fff0ce;border:1px dashed #e3ad53;padding:13px;border-radius:14px;font-weight:900;font-size:14px;margin:18px auto 0;max-width:510px}
.slips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;max-width:510px;margin:25px auto}.slip{border:2px solid #dfa43c;border-radius:15px;background:linear-gradient(145deg,#fff8df,#f5d18b);color:#70431d;min-height:115px;box-shadow:0 6px 0 #b77a25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;transition:transform .16s,box-shadow .16s;position:relative}.slip:hover:not(:disabled){transform:translateY(-5px) rotate(-2deg);box-shadow:0 11px 0 #b77a25}.slip:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #b77a25}.slip .paper{font-size:39px}.slip small{font-weight:1000;letter-spacing:2px}.slip:disabled{cursor:default;opacity:.58}.slip.picked{opacity:1;transform:scale(1.05);border:3px solid var(--red);box-shadow:0 0 0 5px #e84b4830,0 6px 0 #b77a25}
.result{display:none;margin:18px auto 0;padding:24px 14px;border:3px dashed var(--gold);border-radius:22px;background:#fff3d9;animation:pop .55s cubic-bezier(.2,1.6,.4,1)}.result.show{display:block}.result-label{font-size:11px;font-weight:1000;letter-spacing:3px;color:#997b5d}.result-emoji{display:block;font-size:62px;margin:8px;animation:wiggle .65s infinite}.result-word{font-size:clamp(32px,8vw,49px);font-weight:1000;line-height:1.2;margin:8px 0;color:#a93532;overflow-wrap:anywhere}.comment{font-size:15px;line-height:1.7;font-weight:900}.extra{font-size:12px;color:#927b67;font-weight:800;margin-top:8px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}.btn{border:0;border-radius:999px;padding:13px 22px;font-weight:1000;font-size:14px;cursor:pointer;background:var(--red);color:white;box-shadow:0 5px 0 #a92e2e;transition:transform .12s}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #a92e2e}.btn.secondary{background:#66564d;box-shadow:0 5px 0 #3e332e}.fine{font-size:11px;color:#9a887a;font-weight:800;margin-top:23px}.confetti{position:absolute;top:-20px;width:9px;height:15px;pointer-events:none;z-index:5;animation:fall 2.8s ease-in forwards}.shake{animation:shake .45s}.flash{animation:flash .35s 4}
@keyframes pop{0%{transform:scale(.2) rotate(-10deg);opacity:0}70%{transform:scale(1.07) rotate(2deg)}100%{transform:scale(1);opacity:1}}@keyframes wiggle{0%,100%{transform:rotate(-12deg) scale(1)}50%{transform:rotate(12deg) scale(1.15)}}@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-2deg)}40%{transform:translateX(10px) rotate(2deg)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}@keyframes flash{50%{filter:brightness(1.35)}}@keyframes fall{to{transform:translate(var(--drift),650px) rotate(900deg);opacity:0}}
@media(max-width:430px){body{padding:10px}.wrap{padding:20px 13px;border-radius:23px}.slips{gap:9px}.slip{min-height:96px}.slip .paper{font-size:33px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="wrap" id="stage">
  <div class="kicker">THE OFFICIAL WEDDING FATE CEREMONY</div>
  <h1 class="title">💍 하니의<br><span>결혼식</span></h1>
  <div class="stamp">참석 의무 없음 · 운명은 있음</div>
  <p class="desc">인생은 선택의 연속, 하지만 오늘은 랜덤이다.<br>제비 하나를 고르십시오. 결과에 대한 책임은 본인에게 있습니다.</p>
  <div class="decor" aria-hidden="true">🎩 🥁 🎺</div>
  <div class="notice" id="notice" aria-live="polite">👇 운명의 제비를 하나 선택하십시오.</div>
  <section class="slips" id="slips" aria-label="제비 6개">
    <button class="slip" type="button"><span class="paper">📜</span><small>운명 01</small></button>
    <button class="slip" type="button"><span class="paper">📜</span><small>운명 02</small></button>
    <button class="slip" type="button"><span class="paper">📜</span><small>운명 03</small></button>
    <button class="slip" type="button"><span class="paper">📜</span><small>운명 04</small></button>
    <button class="slip" type="button"><span class="paper">📜</span><small>운명 05</small></button>
    <button class="slip" type="button"><span class="paper">📜</span><small>운명 06</small></button>
  </section>
  <section class="result" id="result" aria-live="assertive">
    <div class="result-label">DESTINY HAS BEEN DECIDED</div>
    <span class="result-emoji" id="resultEmoji">🎉</span>
    <div class="result-word" id="resultWord"></div>
    <div class="comment" id="resultComment"></div>
    <div class="extra" id="resultExtra"></div>
  </section>
  <div class="actions">
    <button class="btn" id="again" type="button" hidden>🔄 다시 뽑기</button>
    <button class="btn secondary" id="sound" type="button" aria-pressed="true">🔊 효과음 ON</button>
  </div>
  <p class="fine">※ 본 추첨 결과에 대한 이의제기는 신랑 측에서 받지 않습니다.<br>HANI WEDDING COMMITTEE © 운명은 이미 정해져 있었다.</p>
</main>
<script>
(()=>{
 const $=id=>document.getElementById(id),stage=$('stage'),slips=[...document.querySelectorAll('.slip')];
 const outcomes=[
  {word:'늦는다.',emoji:'🏃',comment:'시간은 금이다.<br>하지만 당신의 시간은 예외인가 봅니다.',extra:'신랑 신부보다 늦게 입장하는 레전드 등장.'},
  {word:'가지 않는다.',emoji:'🛌',comment:'축하합니다!<br>침대와의 의리를 지키셨습니다.',extra:'축의금은 마음속 계좌로 입금 완료.'},
  {word:'사진을 찍지 않는다.',emoji:'📸',comment:'역사적인 순간을<br>기억에서 삭제하기로 결정하셨습니다.',extra:'카메라가 당신을 거부한 것이 아닙니다.'},
  {word:'뷔페만 먹는다.',emoji:'🍖',comment:'결혼식의 본질을 정확히 꿰뚫으셨군요.',extra:'축하보다 갈비찜이 먼저인 사람.'},
  {word:'날짜를 헷갈린다.',emoji:'📅',comment:'이 정도면 참석 의지가<br>달력에게도 전달되지 않은 듯합니다.',extra:'다음 주에 혼자 축하할 예정.'},
  {word:'참석한다.',emoji:'💐',comment:'이런... 정상적인 결과가 나와버렸습니다.',extra:'하니가 당신의 참석을 진심으로 기다립니다. (아마도)'}
 ];
 let deck=[],busy=false,soundOn=true,audio;
 function shuffle(){deck=[...outcomes];for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}}
 function tone(freq,duration,type='sine',vol=.065,delay=0){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime+delay);g.gain.setValueAtTime(vol,audio.currentTime+delay);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+delay+duration);o.connect(g);g.connect(audio.destination);o.start(audio.currentTime+delay);o.stop(audio.currentTime+delay+duration)}catch(e){}}
 function fanfare(){[523,659,784,1047,784,1047,1318,1568].forEach((f,i)=>tone(f,.22,'triangle',.075,i*.12));tone(1568,.7,'sawtooth',.03,.95)}
 function confetti(){const colors=['#ff4545','#ffcf38','#45b9ff','#8c52ff','#53d769','#ff75c8'];for(let i=0;i<110;i++){const p=document.createElement('i');p.className='confetti';p.style.left=Math.random()*100+'%';p.style.background=colors[i%colors.length];p.style.setProperty('--drift',(Math.random()*400-200)+'px');p.style.animationDelay=Math.random()*.7+'s';p.style.width=(5+Math.random()*9)+'px';p.style.height=(8+Math.random()*13)+'px';stage.appendChild(p);setTimeout(()=>p.remove(),3500)}}
 function draw(i){if(busy)return;busy=true;slips.forEach(b=>b.disabled=true);slips[i].classList.add('picked');$('notice').textContent='🔮 운명의 문이 열리는 중...';stage.classList.add('shake');tone(180,.5,'sawtooth',.06);setTimeout(()=>{const o=deck[i];$('resultWord').textContent=o.word;$('resultEmoji').textContent=o.emoji;$('resultComment').innerHTML=o.comment;$('resultExtra').textContent=o.extra;$('result').classList.add('show');stage.classList.remove('shake');stage.classList.add('flash');confetti();fanfare();$('notice').textContent='🚨 추첨 결과가 공식 발표되었습니다. 🚨';$('again').hidden=false;busy=false;},900)}
 slips.forEach((b,i)=>b.addEventListener('click',()=>draw(i)));
 $('again').addEventListener('click',()=>{busy=false;shuffle();slips.forEach(b=>{b.disabled=false;b.classList.remove('picked')});$('result').classList.remove('show');stage.classList.remove('flash');$('again').hidden=true;$('notice').textContent='👇 운명의 제비를 하나 선택하십시오.';});
 $('sound').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊 효과음 ON':'🔇 효과음 OFF';e.currentTarget.setAttribute('aria-pressed',String(soundOn));if(soundOn)tone(880,.15)});
 shuffle();
})();
</script>
</body>
</html>
